<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B7A4D">
<title>Sổ chi tiêu chuyến đi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23B8352A'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='serif' font-weight='700'%3E%E5%B8%B3%3C/text%3E%3C/svg%3E">
<style>
:root{--serif:"Noto Serif",Georgia,serif;--sans:system-ui,Roboto,"Segoe UI",sans-serif;--mono:ui-monospace,"Roboto Mono",monospace;
--bg:#EFE9DD;--paper:#FFFDF8;--ink:#1E2733;--mut:#6B7280;--line:#E4DDCF;--ac:#3B7A4D;--ac2:#C6613A;--acSoft:#E6EFE8;--pos:#2F7A4F;--neg:#B6463A;--stamp:#B8352A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.hidden{display:none!important}

/* header */
.hd{position:relative;height:250px;overflow:hidden;background:#C9DFCB}
.hd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.hdtx{position:absolute;left:16px;right:16px;top:calc(18px + env(safe-area-inset-top));display:flex;align-items:flex-start;gap:12px;color:#1E2733}
.hd.dk .hdtx{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.stamp{position:relative;flex:none;width:42px;height:42px;border-radius:9px;background:var(--stamp);color:#fff;font:700 23px var(--serif);display:grid;place-items:center;transform:rotate(-4deg);box-shadow:0 2px 0 rgba(0,0,0,.12);text-shadow:none}
.hdmain{flex:1;min-width:0;color:inherit}
.ttl{font:600 22px/1.2 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;opacity:.82;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdbtn{position:absolute;left:40px;top:calc(12px + env(safe-area-inset-top));width:24px;height:24px;display:grid;place-items:center}
.sdot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:#9AA0A6;display:inline-block;flex:none}
.sdot.s-ok{background:#3BA55C}.sdot.s-busy{background:#E8A23A}.sdot.s-offline,.sdot.s-off{background:#9AA0A6}
.sdot.s-pin,.sdot.s-locked,.sdot.s-error,.sdot.s-server,.sdot.s-setup,.sdot.s-foreign,.sdot.s-bad,.sdot.s-noserver{background:#D9483B}
.sdot.inl{border-color:transparent}
.banner{background:#B6463A;color:#fff;font-size:13px;padding:8px 16px;text-align:center}

/* receipt */
.wrap{position:relative;margin-top:-84px;padding:0 12px;max-width:520px;margin-left:auto;margin-right:auto}
.rc{position:relative;background:var(--paper);padding:10px 18px 18px;margin:12px 4px 26px;box-shadow:0 18px 30px -24px rgba(30,39,51,.55)}
.rc:before,.rc:after{content:"";position:absolute;left:0;right:0;height:10px;background:linear-gradient(-45deg,var(--paper) 6px,transparent 0),linear-gradient(45deg,var(--paper) 6px,transparent 0);background-size:12px 12px}
.rc:before{top:-10px;background-position:left bottom}
.rc:after{bottom:-10px;transform:rotate(180deg)}
.rh{text-align:center;padding:10px 0 4px}
.eyebrow{font:700 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.h2{font:600 24px var(--serif);margin:6px 0 4px}
.big{font:600 32px var(--mono);margin-top:6px;letter-spacing:-.01em}
.big i{font-style:normal;font-size:18px;color:var(--mut)}
.dash{border-top:1.5px dashed var(--line);margin:14px 0}
.lbl{font:700 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.sm{font-size:13.5px;color:var(--mut);margin-top:6px}
.c{text-align:center}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.empty,.settled{text-align:center;color:var(--mut);font-size:13.5px;padding:14px 0;font-style:italic}
.foot{text-align:center;font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ac2);margin-top:14px}
.note{font-size:13px;color:var(--mut);text-align:center;margin:-12px 8px 18px}
.note.bad{color:var(--neg);margin:12px 4px}
.mt8{margin-top:8px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0;font-size:14px}

/* list rows */
.day{display:flex;justify-content:space-between;font:600 12px var(--mono);color:var(--mut);margin:14px 0 2px;letter-spacing:.02em}
.day:first-of-type{margin-top:4px}
.it,.pb,.trip{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.day+.it{border-top:0}
.it .t,.pb .t,.trip .t{flex:1;min-width:0;display:flex;flex-direction:column}
.d{font-weight:600;overflow-wrap:anywhere}
.m{font-size:12.5px;color:var(--mut);margin-top:1px;overflow-wrap:anywhere}
.a{font:600 14.5px var(--mono);white-space:nowrap}
.v{font:600 15px var(--mono);white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.go{font-size:13px;color:var(--ac);font-weight:600}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.av.sm{width:24px;height:24px;font-size:11.5px}
.trip{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.trip.on{border-color:var(--ac);background:var(--acSoft)}
.badge{font-size:11.5px;font-weight:700;color:var(--ac);white-space:nowrap}
.tr{display:flex;align-items:center;gap:7px;width:100%;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;text-align:left}
.tr>.av,.tr .arr{flex:none}
.tr .nm{flex:0 1 auto;min-width:1.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .x{flex:none;margin-left:auto;padding-left:6px;font:600 14px var(--mono);white-space:nowrap}
.arr{color:var(--ac2);font-weight:700}
.log{font:12px var(--mono);color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;max-height:150px;overflow:auto;overflow-wrap:anywhere}
.fl{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.fl span{color:var(--mut)}.fl.bad span{color:var(--neg)}

/* controls */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns.col{flex-direction:column}
.btn{min-height:44px;padding:0 16px;border-radius:999px;background:var(--ac);color:#fff;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btns:not(.col) .btn{flex:1 1 auto}
.btn.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn.d{background:transparent;color:var(--neg);border:1.5px solid #E2B4AE}
.btn:disabled{opacity:.5}
.link{color:var(--ac);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit;padding:0 2px}
.fld{margin-top:14px}
.fld label,.flab{display:flex;justify-content:space-between;align-items:baseline;font:700 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.flab .link{font:600 12.5px var(--sans);letter-spacing:0;text-transform:none}
.in{width:100%;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:16px var(--sans);color:var(--ink);min-width:0}
.in:focus{outline:none;border-color:var(--ac)}
.in.amt{font:600 20px var(--mono);text-align:right}
.ta{min-height:180px;font:12.5px var(--mono);margin-top:10px}
.srow{display:flex;gap:8px;margin-top:10px}.srow .in{flex:1}.srow .btn{flex:none}
.fld .srow{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:4px 12px 4px 5px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;opacity:.6;max-width:100%}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{opacity:1;border-color:var(--ac);background:var(--acSoft)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.dot.on{border-color:#fff;box-shadow:0 0 0 2.5px var(--ink)}
.err{color:var(--neg);font-size:13.5px;margin-top:10px;min-height:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{flex:1 1 auto;min-height:40px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;text-align:center;background:#fff}
.seg button.on{border-color:var(--ac);background:var(--acSoft);color:var(--ac)}
.tog{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:6px 0;text-align:left}
.tog .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:#CFC8BA;position:relative;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on .sw{background:var(--ac)}.tog.on .sw:after{transform:translateX(18px)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;width:68px;font-size:11.5px;color:var(--mut);text-align:center}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ac);font-weight:700}
.fab{width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 18px -6px rgba(0,0,0,.4)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;fill:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(20,24,30,.42);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:20px 20px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease-out;max-width:560px;margin:0 auto;outline:none}
.sheet.open{transform:none}
.sh-h{position:sticky;top:-6px;z-index:2;background:var(--paper);display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.sh-t{flex:1;font:600 19px var(--serif)}
.shx{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:16px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:40;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;max-width:88vw;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* lite mode: no motion */
body.lite *,body.lite *:before,body.lite *:after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.hd{height:280px}}

</style>
</head>
<body>
<div id="banner" class="banner hidden" role="alert"></div>
<header class="hd" id="hd">
  <img id="hdImg" alt="">
  <div class="hdtx">
    <button class="stamp" data-act="tripSwitch" aria-label="Chọn chuyến đi">帳</button>
    <button class="hdmain" data-act="tripSwitch"><div class="ttl" id="hdTitle"></div><div class="sub" id="hdSub"></div></button>
  </div>
  <button class="sdbtn" data-act="syncDot" aria-label="Trạng thái đồng bộ"><span id="sdot" class="sdot hidden"></span></button>
</header>
<main class="wrap" id="main"></main>
<nav class="tabs" id="tabs">
  <button class="tab" data-act="tab" data-tab="ledger"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Sổ</button>
  <button class="tab" data-act="tab" data-tab="balance"><svg viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg>Cân bằng</button>
  <button class="fab" data-act="add" aria-label="Thêm khoản chi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-act="tab" data-tab="trips"><svg viewBox="0 0 24 24"><path d="M3 19l6-9 4 5 3-4 5 8z"/></svg>Chuyến</button>
  <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Cài đặt</button>
</nav>
<div id="scrim" class="scrim hidden"></div>
<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true" tabindex="-1"></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>
<script>
'use strict';
/* ===== data.js — storage, sanitizers, state, formatting ===== */
const APP_ID = 'caguman';
const VERSION = '1.0 · 2026-10-14';
const LS_KEY = 'cgm.v1', LS_DEV = 'cgm.dev', LS_VIS = 'cgm.vis', LS_DIAG = 'cgm.diag';
const DEFAULT_SERVER = 'https://caguman.emile-cao.workers.dev';
const SYNC_COLS = ['trips', 'members', 'expenses', 'payments'];
const PALETTE = ['#1D7898', '#C6613A', '#3B7A4D', '#7A4B8F', '#B8862B', '#B6463A', '#4569B3', '#5E7D2E'];
const MAX = { trips: 500, members: 3000, expenses: 30000, payments: 10000 };

/* ---------- storage ---------- */
let STORAGE_OK = true;
function lsGet(k) {
  try { return localStorage.getItem(k); } catch (e) { STORAGE_OK = false; return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); return true; }
  catch (e) { STORAGE_OK = false; if (typeof storageBanner === 'function') storageBanner(); return false; }
}
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

/* ---------- sanitizers ---------- */
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const sStr = (v, n = 200) => typeof v === 'string' ? v.replace(/[\u0000-\u001f\u007f\u2028\u2029]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n) : '';
const sId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(v) ? v : '';
const sNum = (v, min, max, d) => { const n = typeof v === 'string' && v.trim() === '' ? NaN : Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : d; };
const sTs = v => Math.round(sNum(v, 0, 4102444800000, 0));
const sBool = v => v === true || v === 1;
const sDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v + 'T00:00:00')) ? v : '';
const sAmt = v => { const n = Math.round(sNum(v, 0, 1e12, 0)); return n > 0 ? n : 0; };
function sDel(o) {
  const out = {}, cut = Date.now() - 400 * 864e5;
  if (isObj(o)) for (const k of Object.keys(o).sort()) { if (!sId(k)) continue; const t = sTs(o[k]); if (t > cut) out[k] = t; }
  return out;
}
function sTrip(x) {
  if (!isObj(x)) return null;
  const id = sId(x.id), name = sStr(x.name, 60);
  if (!id || !name) return null;
  return { id, name, at: sTs(x.at), u: sTs(x.u) };
}
function sMember(x) {
  if (!isObj(x)) return null;
  const id = sId(x.id), trip = sId(x.trip), name = sStr(x.name, 40);
  if (!id || !trip || !name) return null;
  return { id, trip, name, c: Math.round(sNum(x.c, 0, PALETTE.length - 1, 0)), u: sTs(x.u) };
}
function sIds(a, n = 60) {
  if (!Array.isArray(a)) return [];
  const out = [];
  for (const v of a) { const id = sId(v); if (id && !out.includes(id)) out.push(id); if (out.length >= n) break; }
  return out;
}
function sExpense(x) {
  if (!isObj(x)) return null;
  const id = sId(x.id), trip = sId(x.trip), desc = sStr(x.desc, 120), amount = sAmt(x.amount), payer = sId(x.payer), split = sIds(x.split);
  if (!id || !trip || !desc || !amount || !payer || !split.length) return null;
  return { id, trip, desc, amount, payer, split, date: sDate(x.date), at: sTs(x.at), u: sTs(x.u) };
}
function sPayment(x) {
  if (!isObj(x)) return null;
  const id = sId(x.id), trip = sId(x.trip), from = sId(x.from), to = sId(x.to), amount = sAmt(x.amount);
  if (!id || !trip || !from || !to || from === to || !amount) return null;
  return { id, trip, from, to, amount, date: sDate(x.date), at: sTs(x.at), u: sTs(x.u) };
}
const SAN = { trips: sTrip, members: sMember, expenses: sExpense, payments: sPayment };
function sList(arr, fn, max) {
  if (!Array.isArray(arr)) return [];
  const m = new Map();
  for (const raw of arr) {
    const x = fn(raw); if (!x) continue;
    const o = m.get(x.id);
    if (!o || (x.u || 0) > (o.u || 0)) m.set(x.id, x);
    if (m.size >= max) break;
  }
  return [...m.values()];
}
function sanitizeState(o) {
  o = isObj(o) ? o : {};
  const st = { del: sDel(o.del) };
  for (const col of SYNC_COLS) st[col] = sList(o[col], SAN[col], MAX[col]);
  purgeOrphans(st);
  return { trips: st.trips, members: st.members, expenses: st.expenses, payments: st.payments, del: st.del };
}
/* Items whose trip no longer exists are dropped (a trip deleted on one phone while another added to it). */
function purgeOrphans(st) {
  const t = new Set(st.trips.map(x => x.id));
  for (const col of ['members', 'expenses', 'payments']) st[col] = st[col].filter(x => t.has(x.trip));
}
const emptyState = () => ({ trips: [], members: [], expenses: [], payments: [], del: {} });

/* ---------- device-only settings (never synced, never in a backup) ---------- */
function sDev(o) {
  o = isObj(o) ? o : {};
  return {
    trip: sId(o.trip),
    theme: ['random', 'earth', 'forest', 'sea', 'wind'].includes(o.theme) ? o.theme : 'random',
    lite: sBool(o.lite),
    payer: isObj(o.payer) ? Object.fromEntries(Object.entries(o.payer).filter(([k, v]) => sId(k) && sId(v)).slice(-50)) : {},
    bkAt: sTs(o.bkAt),
    bkN: Math.round(sNum(o.bkN, 0, 1e7, 0))
  };
}

/* ---------- ids, numbers, dates ---------- */
function newId() {
  let r = '';
  try { const a = new Uint32Array(2); crypto.getRandomValues(a); r = a[0].toString(36) + a[1].toString(36); }
  catch (e) { r = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); }
  return (Date.now().toString(36) + r).replace(/[^a-z0-9]/g, '').slice(0, 20);
}
function fmt(n) {
  const v = Math.round(Number(n) || 0);
  return (v < 0 ? '−' : '') + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
const fmtSigned = n => (Math.round(n) > 0 ? '+' : '') + fmt(n);
const digits = s => String(s || '').replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '').slice(0, 12);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
function fmtDay(key, short) {
  if (!key) return 'Không rõ ngày';
  const d = new Date(key + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - d) / 864e5);
  const base = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` + (d.getFullYear() !== t.getFullYear() ? '/' + d.getFullYear() : '');
  if (short) return base;
  if (diff === 0) return 'Hôm nay · ' + base;
  if (diff === 1) return 'Hôm qua · ' + base;
  return WD[d.getDay()] + ' · ' + base;
}
const dayOfItem = x => x.date || (x.at ? keyOf(new Date(x.at)) : '');

/* ---------- lookups and maths ---------- */
const curTrip = () => S.trips.find(t => t.id === DEV.trip) || null;
const memberOf = id => S.members.find(m => m.id === id);
const nameOf = id => { const m = memberOf(id); return m ? m.name : 'Người đã xoá'; };
const colorOf = id => { const m = memberOf(id); return m ? PALETTE[m.c] : '#9AA0A6'; };
const avatar = (id, sm) => `<span class="av${sm ? ' sm' : ''}" style="background:${colorOf(id)}" aria-hidden="true">${esc(initial(nameOf(id)))}</span>`;

function tripData(tid) {
  const mem = S.members.filter(m => m.trip === tid);
  const ex = S.expenses.filter(e => e.trip === tid);
  const pay = S.payments.filter(p => p.trip === tid);
  const order = mem.map(m => m.id);
  ex.forEach(e => [e.payer, ...e.split].forEach(i => { if (!order.includes(i)) order.push(i); }));
  pay.forEach(p => [p.from, p.to].forEach(i => { if (!order.includes(i)) order.push(i); }));
  const paid = {}, share = {}, sent = {}, got = {}, bal = {};
  order.forEach(i => { paid[i] = share[i] = sent[i] = got[i] = 0; });
  let total = 0;
  for (const e of ex) { total += e.amount; paid[e.payer] += e.amount; const s = e.amount / e.split.length; e.split.forEach(i => { share[i] += s; }); }
  for (const p of pay) { sent[p.from] += p.amount; got[p.to] += p.amount; }
  order.forEach(i => { bal[i] = paid[i] - share[i] + sent[i] - got[i]; });
  return { mem, ex, pay, order, paid, share, sent, got, bal, total, transfers: computeTransfers(bal, order) };
}
function computeTransfers(bal, order) {
  const cr = [], db = [];
  order.forEach((id, i) => { const b = Math.round(bal[id] || 0); if (b > 1) cr.push({ id, a: b, i }); else if (b < -1) db.push({ id, a: -b, i }); });
  const by = (x, y) => y.a - x.a || x.i - y.i;
  cr.sort(by); db.sort(by);
  const out = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) {
    const p = Math.min(db[i].a, cr[j].a);
    if (p > 1) out.push({ from: db[i].id, to: cr[j].id, amt: p });
    db[i].a -= p; cr[j].a -= p;
    if (db[i].a <= 1) i++;
    if (cr[j].a <= 1) j++;
  }
  return out;
}

/* ---------- history: Back closes sheets; Back on the main screen needs two swipes ---------- */
let HIST_OK = true, lastBack = 0;
let sheetOpen = false, sheetClosing = false, sheetQueue = null, sheetCtx = null, sheetTok = 0;
function initHistory() {
  try { history.replaceState({ cgm: 'base' }, ''); history.pushState({ cgm: 'guard' }, ''); }
  catch (e) { HIST_OK = false; logDiag('history blocked'); }
}
function pushHist(k) { if (!HIST_OK) return; try { history.pushState({ cgm: k }, ''); } catch (e) { HIST_OK = false; } }
window.addEventListener('popstate', () => {

  const st = history.state && history.state.cgm;
  if (st === 'guard' || st === 'sheet') return;
  if (TAB !== 'ledger') { setTab('ledger'); pushHist('guard'); return; }
  if (Date.now() - lastBack < 2500) { try { history.back(); } catch (e) { /* ignore */ } return; }
  lastBack = Date.now(); toast('Vuốt lại lần nữa để thoát'); pushHist('guard');

    sheetOpen = true; pushHist('sheet');
    el.classList.remove('hidden'); $('#scrim').classList.remove('hidden');
    void el.offsetWidth; el.classList.add('open'); $('#scrim').classList.add('open');

  if (!sheetOpen || sheetClosing) return;

    sheetClosing = true;
    try { history.back(); } catch (e) { sheetClosing = false; hideSheet(); return; }
    const tok = sheetTok;
    setTimeout(() => { if (sheetClosing && tok === sheetTok) { sheetClosing = false; hideSheet(); flushSheetQueue(); } }, 700);
  } else hideSheet();

  if (DEV.lite) done(); else setTimeout(done, 220);

}

function drawExpChips() {
  const c = sheetCtx; if (!c || c.kind !== 'exp') return;
  const ids = expIds(c);
  $('#cPayer').innerHTML = ids.map(id => chip(id, c.payer === id, 'pickPayer')).join('');
  $('#cSplit').innerHTML = ids.map(id => chip(id, c.split.has(id), 'toggleSplit')).join('');
  updatePerHead();
}
function updatePerHead() {
  const c = sheetCtx, el = $('#perHead'); if (!c || !el) return;
  const a = Number(digits($('#fAmt').value)) || 0, n = c.split.size;
  el.textContent = !n ? 'Chưa chọn ai' : a ? `Mỗi người ${fmt(a / n)} ₫ · ${n} người` : `${n} người`;
}

/* ---------- payment sheet ---------- */
function paymentSheet(id, pre) {
  const t = curTrip(); if (!t) return;
  const memIds = S.members.filter(m => m.trip === t.id).map(m => m.id);
  const p = id ? S.payments.find(x => x.id === id) : null;
  if (id && !p) return toast('Khoản này không còn nữa');
  if (memIds.length < 2 && !p) return toast('Cần ít nhất 2 người');
  const ctx = { kind: 'pay', id: p ? p.id : '', trip: p ? p.trip : t.id, from: p ? p.from : pre ? pre.from : memIds[0], to: p ? p.to : pre ? pre.to : memIds[1] };
  const amt = p ? p.amount : pre ? pre.amt : 0;
  openSheet(`${sheetHead(p ? 'Sửa thanh toán' : 'Ghi thanh toán')}
    <div class="fld"><div class="flab">Người trả</div><div class="chips" id="cFrom"></div></div>
    <div class="fld"><div class="flab">Người nhận</div><div class="chips" id="cTo"></div></div>
    <div class="fld"><label for="pAmt">Số tiền (₫)</label><div class="srow"><input class="in amt" id="pAmt" inputmode="numeric" autocomplete="off" placeholder="0" value="${amt ? fmt(amt) : ''}"><button class="btn g" data-act="add000" data-for="pAmt">000</button></div></div>
    <div class="fld"><label for="pDate">Ngày</label><input class="in" id="pDate" type="date" value="${p && p.date ? p.date : todayKey()}"></div>
    <div class="err" id="pErr" role="alert"></div>
    <div class="btns"><button class="btn" data-act="savePay">${p ? 'Lưu thay đổi' : 'Ghi đã trả'}</button>${p ? '<button class="btn d" data-act="delPay">Xoá</button>' : ''}</div>`, ctx);
  drawPayChips();
}
function drawPayChips() {
  const c = sheetCtx; if (!c || c.kind !== 'pay') return;
  const ids = S.members.filter(m => m.trip === c.trip).map(m => m.id);
  for (const i of [c.from, c.to]) if (i && !ids.includes(i)) ids.push(i);
  $('#cFrom').innerHTML = ids.map(id => chip(id, c.from === id, 'pickFrom')).join('');
  $('#cTo').innerHTML = ids.map(id => chip(id, c.to === id, 'pickTo')).join('');
}

/* ---------- trip and member sheets ---------- */
function parseNames(s) {
  const out = [];
  for (const raw of String(s || '').split(/[,;\n]+/)) {
    const n = sStr(raw, 40);
    if (n && !out.some(x => x.toLocaleLowerCase('vi') === n.toLocaleLowerCase('vi'))) out.push(n);
    if (out.length >= 30) break;
  }
  return out;
}
function tripSheet() {
  const t = curTrip(), d = new Date();
  const prev = t ? S.members.filter(m => m.trip === t.id) : [];
  openSheet(`${sheetHead('Chuyến đi mới')}
    <div class="fld"><label for="tName">Tên chuyến</label><input class="in" id="tName" maxlength="60" autocomplete="off" value="Chuyến đi ${pad(d.getDate())}/${pad(d.getMonth() + 1)}"></div>
    ${prev.length ? `<button class="tog on" data-act="toggleReuse" id="reuse" aria-pressed="true"><span class="t"><span class="d">Dùng lại thành viên</span><span class="m">${esc(prev.map(m => m.name).join(', '))}</span></span><span class="sw"></span></button>` : ''}
    <div class="fld"><label for="tMem">${prev.length ? 'Thêm người khác' : 'Thành viên'}</label><input class="in" id="tMem" maxlength="400" autocomplete="off" placeholder="Tên, cách nhau bằng dấu phẩy"></div>
    <div class="err" id="tErr" role="alert"></div>
    <div class="btns"><button class="btn" data-act="saveTrip">Tạo chuyến</button></div>`, { kind: 'trip', reuse: prev.length > 0, from: t ? t.id : '' });
}
function tripSwitchSheet() {
  const trips = [...S.trips].sort((a, b) => (b.at || 0) - (a.at || 0));
  openSheet(`${sheetHead('Chọn chuyến đi')}` + trips.map(x => `<button class="trip${x.id === DEV.trip ? ' on' : ''}" data-act="pickTrip" data-id="${x.id}"><span class="t"><span class="d">${esc(x.name)}</span></span>${x.id === DEV.trip ? '<span class="badge">Đang xem</span>' : ''}</button>`).join('') +
    `<div class="btns col"><button class="btn g" data-act="newTrip">＋ Chuyến đi mới</button></div>`, { kind: 'switch' });
}
function memberSheet(id) {
  const m = memberOf(id); if (!m) return toast('Người này không còn nữa');
  const used = S.expenses.some(e => e.trip === m.trip && (e.payer === id || e.split.includes(id))) || S.payments.some(p => p.trip === m.trip && (p.from === id || p.to === id));
  openSheet(`${sheetHead('Thành viên')}
    <div class="fld"><label for="mName">Tên</label><input class="in" id="mName" maxlength="40" autocomplete="off" value="${esc(m.name)}"></div>
    <div class="flab">Màu</div><div class="chips" id="cCol">${PALETTE.map((c, i) => `<button class="dot${m.c === i ? ' on' : ''}" data-act="pickCol" data-i="${i}" style="background:${c}" aria-label="Màu ${i + 1}"></button>`).join('')}</div>
    <div class="err" id="mErr" role="alert"></div>
    <div class="btns"><button class="btn" data-act="saveMember">Lưu</button>${used ? '' : '<button class="btn d" data-act="delMember">Xoá khỏi chuyến</button>'}</div>
    ${used ? '<p class="hint">Người này đã có trong khoản chi hoặc thanh toán nên không xoá được. Bạn vẫn có thể đổi tên.</p>' : ''}`, { kind: 'member', id, c: m.c });
}
function renameTripSheet() {
  const t = curTrip(); if (!t) return;
  openSheet(`${sheetHead('Đổi tên chuyến')}<div class="fld"><label for="rName">Tên chuyến</label><input class="in" id="rName" maxlength="60" autocomplete="off" value="${esc(t.name)}"></div>
    <div class="err" id="rErr" role="alert"></div><div class="btns"><button class="btn" data-act="saveRename">Lưu</button></div>`, { kind: 'rename', id: t.id });
}
function confirmSheet(title, text, label, onYes) {
  openSheet(`${sheetHead(title)}<p class="sm">${text}</p><div class="btns"><button class="btn d" data-act="confirmYes">${esc(label)}</button><button class="btn g" data-act="closeSheet">Huỷ</button></div>`, { kind: 'confirm', onYes });
}
function textSheet(title, text, note) {
  openSheet(`${sheetHead(title)}${note ? `<p class="sm">${esc(note)}</p>` : ''}<textarea class="in ta" id="tsText" readonly>${esc(text)}</textarea><div class="btns"><button class="btn" data-act="copyTs">Chép</button></div>`, { kind: 'text' });
}
function copyText(text, done) {
  const fallback = () => textSheet('Chép thủ công', text, 'Không chép tự động được. Giữ ngón tay lên ô dưới để chọn và chép.');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => toast(done || 'Đã chép'), fallback); return; }
  } catch (e) { /* fall through */ }
  fallback();
}

/* ---------- summary text ---------- */
function summaryText() {
  const t = curTrip(); if (!t) return '';
  const d = tripData(t.id);
  const lines = [t.name, `Tổng: ${fmt(d.total)} ₫ · ${d.ex.length} khoản chi`, ''];
  d.order.forEach(id => lines.push(`${nameOf(id)}: đã trả ${fmt(d.paid[id])} ₫ · phần chia ${fmt(d.share[id])} ₫`));
  lines.push('', 'Ai trả ai:');
  if (!d.transfers.length) lines.push('Mọi người đã cân bằng ✓');
  d.transfers.forEach(x => lines.push(`• ${nameOf(x.from)} → ${nameOf(x.to)}: ${fmt(x.amt)} ₫`));
  return lines.join('\n');
}

/* ---------- actions ---------- */
const ACT = {
  tab: b => setTab(b.dataset.tab),
  add: () => { const t = curTrip(); if (!t) return tripSheet(); expenseSheet(); },
  closeSheet: () => closeSheet(),
  newTrip: () => tripSheet(),
  tripSwitch: () => { if (!S.trips.length) return tripSheet(); tripSwitchSheet(); },
  pickTrip: b => { DEV.trip = b.dataset.id; saveDev(); if (sheetOpen) closeSheet(); TAB = 'ledger'; render(); window.scrollTo(0, 0); },
  syncDot: () => toast(syncLine(), 3200),
  goSync: () => { setTab('settings'); const el = $('#syncBox'); if (el) el.scrollIntoView({ block: 'center' }); },

  editExp: b => expenseSheet(b.dataset.id),
  pickPayer: b => { sheetCtx.payer = b.dataset.id; drawExpChips(); },
  toggleSplit: b => { const s = sheetCtx.split, id = b.dataset.id; if (s.has(id)) s.delete(id); else s.add(id); drawExpChips(); },
  splitAll: () => { const c = sheetCtx; const ids = S.members.filter(m => m.trip === c.trip).map(m => m.id); const all = ids.every(i => c.split.has(i)); c.split = new Set(all ? [] : ids); drawExpChips(); },
  add000: b => { const el = $('#' + b.dataset.for); if (!el) return; const d = digits(el.value) || '1'; el.value = fmt(Number((d + '000').slice(0, 12))); updatePerHead(); },
  saveExp: () => {
    const c = sheetCtx, err = m => { $('#fErr').textContent = m; };
    const desc = sStr($('#fDesc').value, 120), amount = Number(digits($('#fAmt').value)), date = sDate($('#fDate').value) || todayKey();
    if (!desc) return err('Nhập nội dung khoản chi.');
    if (!amount) return err('Nhập số tiền lớn hơn 0.');
    if (!c.split.size) return err('Chọn ít nhất một người để chia.');
    if (!S.trips.some(t => t.id === c.trip)) { closeSheet(); return toast('Chuyến này đã bị xoá trên máy khác'); }
    const split = expIds(c).filter(id => c.split.has(id));
    if (c.id) {
      const e = S.expenses.find(x => x.id === c.id);
      if (!e) { closeSheet(); return toast('Khoản này đã bị xoá trên máy khác'); }
      commit(() => Object.assign(e, { desc, amount, payer: c.payer, split, date }));
    } else {
      if (TAB !== 'ledger' && TAB !== 'balance') { TAB = 'ledger'; window.scrollTo(0, 0); }
      commit(() => S.expenses.push({ id: newId(), trip: c.trip, desc, amount, payer: c.payer, split, date, at: Date.now(), u: 0 }));
    }
    DEV.payer[c.trip] = c.payer; saveDev();
    closeSheet(); toast(c.id ? 'Đã lưu' : 'Đã ghi vào sổ');
  },
  delExp: b => { if (!armed(b)) return; const id = sheetCtx.id; commit(() => { S.expenses = S.expenses.filter(x => x.id !== id); }); closeSheet(); toast('Đã xoá khoản chi'); },

  payTransfer: b => { const t = curTrip(); if (!t) return; const tr = tripData(t.id).transfers[Number(b.dataset.i)]; if (tr) paymentSheet(null, tr); },
  addPay: () => paymentSheet(),
  editPay: b => paymentSheet(b.dataset.id),
  pickFrom: b => { sheetCtx.from = b.dataset.id; drawPayChips(); },
  pickTo: b => { sheetCtx.to = b.dataset.id; drawPayChips(); },
  savePay: () => {
    const c = sheetCtx, err = m => { $('#pErr').textContent = m; };
    const amount = Number(digits($('#pAmt').value)), date = sDate($('#pDate').value) || todayKey();
    if (!c.from || !c.to) return err('Chọn người trả và người nhận.');
    if (c.from === c.to) return err('Người trả và người nhận phải khác nhau.');
    if (!amount) return err('Nhập số tiền lớn hơn 0.');
    if (!S.trips.some(t => t.id === c.trip)) { closeSheet(); return toast('Chuyến này đã bị xoá trên máy khác'); }
    if (c.id) {
      const p = S.payments.find(x => x.id === c.id);
      if (!p) { closeSheet(); return toast('Khoản này đã bị xoá trên máy khác'); }
      commit(() => Object.assign(p, { from: c.from, to: c.to, amount, date }));
    } else commit(() => S.payments.push({ id: newId(), trip: c.trip, from: c.from, to: c.to, amount, date, at: Date.now(), u: 0 }));
    closeSheet(); toast('Đã ghi thanh toán');
  },
  delPay: b => { if (!armed(b)) return; const id = sheetCtx.id; commit(() => { S.payments = S.payments.filter(x => x.id !== id); }); closeSheet(); toast('Đã xoá thanh toán'); },
  shareSummary: async () => {
    const text = summaryText(); if (!text) return;
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    copyText(text, 'Đã chép tóm tắt — dán vào Zalo nhé');
  },

  toggleReuse: b => { sheetCtx.reuse = !sheetCtx.reuse; b.classList.toggle('on', sheetCtx.reuse); b.setAttribute('aria-pressed', sheetCtx.reuse); },
  saveTrip: () => {
    const c = sheetCtx, name = sStr($('#tName').value, 60);
    if (!name) { $('#tErr').textContent = 'Nhập tên chuyến.'; return; }
    const prev = c.reuse && c.from ? S.members.filter(m => m.trip === c.from) : [];
    const names = parseNames($('#tMem').value).filter(n => !prev.some(m => m.name.toLocaleLowerCase('vi') === n.toLocaleLowerCase('vi')));
    const id = newId(), now = Date.now();
    commit(() => {
      S.trips.push({ id, name, at: now, u: 0 });
      prev.forEach(m => S.members.push({ id: newId(), trip: id, name: m.name, c: m.c, u: 0 }));
      names.forEach((n, i) => S.members.push({ id: newId(), trip: id, name: n, c: (prev.length + i) % PALETTE.length, u: 0 }));
      DEV.trip = id; saveDev();
    });
    closeSheet();
    TAB = (prev.length + names.length) ? 'ledger' : 'trips'; render(); window.scrollTo(0, 0);
    toast((prev.length + names.length) ? 'Đã tạo chuyến · bấm + để ghi khoản chi' : 'Đã tạo chuyến · thêm thành viên ở đây');
  },
  renameTrip: () => renameTripSheet(),
  saveRename: () => {
    const name = sStr($('#rName').value, 60), t = S.trips.find(x => x.id === sheetCtx.id);
    if (!name) { $('#rErr').textContent = 'Nhập tên chuyến.'; return; }
    if (t) commit(() => { t.name = name; });
    closeSheet();
  },
  delTrip: () => {
    const t = curTrip(); if (!t) return; const d = tripData(t.id);
    confirmSheet('Xoá chuyến', `Xoá <b>${esc(t.name)}</b> cùng ${d.ex.length} khoản chi và ${d.pay.length} thanh toán?${SC.on ? ' Sẽ xoá trên mọi máy đã đồng bộ.' : ''} Không hoàn tác được.`, 'Xoá chuyến', () => {
      const id = t.id;
      commit(() => { S.trips = S.trips.filter(x => x.id !== id); purgeOrphans(S); fixCurrentTrip(); });
      toast('Đã xoá chuyến');
    });
  },
  confirmYes: b => { if (!armed(b)) return; const f = sheetCtx && sheetCtx.onYes; closeSheet(); if (f) f(); },
  addMember: () => {
    const t = curTrip(), el = $('#newMem'); if (!t || !el) return;
    const name = sStr(el.value, 40); if (!name) return el.focus();
    const mem = S.members.filter(m => m.trip === t.id);
    if (mem.some(m => m.name.toLocaleLowerCase('vi') === name.toLocaleLowerCase('vi'))) return toast('Đã có người tên này');
    if (mem.length >= 30) return toast('Tối đa 30 người mỗi chuyến');
    const used = new Set(mem.map(m => m.c)); let c = 0; while (used.has(c) && c < PALETTE.length - 1) c++;
    commit(() => S.members.push({ id: newId(), trip: t.id, name, c: used.size >= PALETTE.length ? mem.length % PALETTE.length : c, u: 0 }));
    toast('Đã thêm ' + name);
    const n = $('#newMem'); if (n) n.focus();
  },
  member: b => memberSheet(b.dataset.id),
  pickCol: b => { sheetCtx.c = Number(b.dataset.i); document.querySelectorAll('#cCol .dot').forEach(x => x.classList.toggle('on', x === b)); },
  saveMember: () => {
    const c = sheetCtx, m = memberOf(c.id), name = sStr($('#mName').value, 40);
    if (!m) { closeSheet(); return toast('Người này không còn nữa'); }
    if (!name) { $('#mErr').textContent = 'Nhập tên.'; return; }
    if (S.members.some(x => x.trip === m.trip && x.id !== m.id && x.name.toLocaleLowerCase('vi') === name.toLocaleLowerCase('vi'))) { $('#mErr').textContent = 'Đã có người tên này.'; return; }
    commit(() => { m.name = name; m.c = c.c; });
    closeSheet();
  },
  delMember: b => { if (!armed(b)) return; const id = sheetCtx.id; commit(() => { S.members = S.members.filter(x => x.id !== id); }); closeSheet(); toast('Đã xoá'); },

  export: () => doExport(),
  shareBk: () => shareBackup(),
  import: () => { const f = $('#fileIn'); f.value = ''; f.click(); },
  csv: () => exportCsv(),
  importMerge: () => applyImport('merge'),
  importReplace: b => { if (!armed(b)) return; applyImport('replace'); },
  copyTs: () => { const el = $('#tsText'); copyText(el ? el.value : ''); },

  theme: b => { DEV.theme = b.dataset.v; saveDev(); if (DEV.theme !== 'random') THEME = DEV.theme; applyTheme(); render(); },
  lite: () => { DEV.lite = !DEV.lite; saveDev(); document.body.classList.toggle('lite', DEV.lite); render(); },
  copyDiag: () => copyText(diagReport(), 'Đã chép báo cáo'),
  clearDiag: () => { DIAG = []; lsSet(LS_DIAG, '[]'); render(); },
  eraseAll: () => confirmSheet('Xoá toàn bộ dữ liệu', SC.on ? 'Xoá mọi chuyến, khoản chi và thanh toán <b>trên mọi máy đã đồng bộ</b>. Nên xuất file sao lưu trước. Không hoàn tác được.' : 'Xoá mọi chuyến, khoản chi và thanh toán trên máy này. Nên xuất file sao lưu trước. Không hoàn tác được.', 'Xoá hết', () => {
    if (SC.on) commit(() => { for (const col of SYNC_COLS) S[col] = []; fixCurrentTrip(); });
    else { S = emptyState(); takeSnap(); persist(); DEV.trip = ''; DEV.bkN = 0; saveDev(); render(); }
    TAB = 'ledger'; render(); toast('Đã xoá toàn bộ dữ liệu');
  }),

  syncSrvShow: () => { const f = $('#srvFld'); if (f) { f.classList.remove('hidden'); const i = $('#ssrv'); if (i && !i.value) i.value = DEFAULT_SERVER; } },
  syncConnect: async b => {
    const pin = ($('#spin') || {}).value || '', srvEl = $('#ssrv'), fld = $('#srvFld');
    const server = srvEl && fld && !fld.classList.contains('hidden') ? srvEl.value.trim().replace(/\/+$/, '') : '';
    const err = m => { const e = $('#syncErr'); if (e) e.textContent = m; };
    if (!/^\d{4,8}$/.test(pin.trim())) return err('PIN gồm 4 chữ số.');
    if (server && !/^https?:\/\/[^\s"'<>]+$/.test(server)) return err('Địa chỉ phải bắt đầu bằng https://');
    if (!server && !pageServer()) return err(syncErrText({ kind: 'noserver' }));
    b.disabled = true; b.textContent = 'Đang kết nối…';
    try {
      const r = await connectSync(pin.trim(), server);
      if (r === 'ask') {
        openSheet(`${sheetHead('Gộp dữ liệu?')}<p class="sm">Máy này và trên mây đều đã có dữ liệu. Bạn muốn làm gì?</p>
          <div class="btns col"><button class="btn" data-act="connectMerge">Gộp cả hai (nên chọn)</button><button class="btn g" data-act="connectCloud">Dùng bản trên mây</button><button class="btn g" data-act="closeSheet">Huỷ</button></div>
          <p class="hint">“Dùng bản trên mây” sẽ thay dữ liệu trên máy này.</p>`, { kind: 'connect' });
      } else {
        toast(r === 'took' ? 'Đã tải dữ liệu từ mây' : 'Đã kết nối đồng bộ');
        render(); syncNow(true);
      }
    } catch (e) { err(syncErrText(e)); b.disabled = false; b.textContent = 'Kết nối'; }
  },
  connectMerge: () => { finishConnect('merge'); closeSheet(); render(); syncNow(true); toast('Đã gộp và bật đồng bộ'); },
  connectCloud: b => { if (!armed(b)) return; finishConnect('cloud'); closeSheet(); render(); syncNow(true); toast('Đã dùng bản trên mây'); },
  syncNowBtn: () => syncNow(true),
  syncOff: b => { if (!armed(b)) return; disconnectSync(); render(); toast('Đã ngắt đồng bộ · dữ liệu vẫn ở trên máy này'); },
  syncPin: () => { const v = (($('#spin2') || {}).value || '').trim(); if (!/^\d{4,8}$/.test(v)) return toast('PIN gồm 4 chữ số'); SC.pin = v; saveSC(); SY.st = ''; syncNow(true); }
};
function diagReport() {
  return [`Caguman ${VERSION}`, navigator.userAgent,
    `Lưu trữ: ${STORAGE_OK ? 'ok' : 'bị chặn'} · Lite: ${DEV.lite} · History: ${HIST_OK}`,
    `Dữ liệu: ${S.trips.length} chuyến, ${S.members.length} người, ${S.expenses.length} khoản, ${S.payments.length} thanh toán, ${Object.keys(S.del).length} dấu xoá`,
    `Đồng bộ: ${SC.on ? 'bật' : 'tắt'} · ${SY.st} · rev ${SC.rev}`, '',
    ...DIAG.slice(-30).map(x => new Date(x.t).toISOString() + ' ' + x.m)].join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (e.target.closest('#scrim')) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { const r = fn(b, e); if (r && r.catch) r.catch(err => logDiag('act ' + b.dataset.act + ': ' + (err && err.message || err))); }
  catch (err) { logDiag('act ' + b.dataset.act + ': ' + (err && err.stack || err)); toast('Có lỗi xảy ra · xem Chẩn đoán trong Cài đặt'); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('amt')) {
    const d = digits(el.value); el.value = d ? fmt(Number(d)) : '';
    if (el.id === 'fAmt') updatePerHead();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target && e.target.id;
  if (id === 'newMem') { e.preventDefault(); ACT.addMember(); }
  else if (id === 'spin') { e.preventDefault(); const b = document.querySelector('[data-act=syncConnect]'); if (b) b.click(); }
});
$('#scrim').addEventListener('click', () => closeSheet());
$('#fileIn').addEventListener('change', e => { const f = [...(e.target.files || [])]; e.target.value = ''; if (f.length) readImport(f); });

/* ---------- stability: crash detection, visibility, timers ---------- */
function markVis() { lsSet(LS_VIS, JSON.stringify({ vis: document.visibilityState === 'hidden' ? 0 : 1, t: Date.now() })); }
function checkCrash() {
  let o = null; try { o = JSON.parse(lsGet(LS_VIS) || 'null'); } catch (e) { /* ignore */ }
  if (isObj(o) && o.vis === 1 && Date.now() - sTs(o.t) < 10 * 60e3) {
    CRASHED = true; logDiag('last session closed while open');
    if (!DEV.lite) { DEV.lite = true; saveDev(); }
  }
  markVis();
}
document.addEventListener('visibilitychange', () => {
  markVis();
  if (document.visibilityState === 'hidden') flushOnHide();
  else { updateScene(); if (!isTyping()) render(); if (SC.on) syncNow(false); }
});
window.addEventListener('pagehide', () => { lsSet(LS_VIS, JSON.stringify({ vis: 0, t: Date.now() })); flushOnHide(); });
window.addEventListener('online', () => { if (SC.on) syncNow(false); });
window.addEventListener('error', e => logDiag('error: ' + (e.message || '') + ' @' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => logDiag('promise: ' + (e.reason && (e.reason.message || e.reason.kind) || e.reason)));
function storageBanner() { const b = $('#banner'); if (b) { b.textContent = 'Không lưu được trên máy này — hãy xuất file sao lưu.'; b.classList.remove('hidden'); } }

/* ---------- start ---------- */
function start() {
  loadAll();
  checkCrash();
  document.body.classList.toggle('lite', DEV.lite);
  pickTheme();
  initHistory();
  render();
  if (!STORAGE_OK) storageBanner();
  if (CRASHED) toast('Lần trước ứng dụng bị đóng bất ngờ · đã bật Chế độ nhẹ', 4000);
  setSync(SC.on ? 'busy' : 'off');
  if (SC.on) syncNow(false);
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    markVis(); updateScene();
    if (!isTyping()) render();
    if (SC.on) syncNow(false);
  }, 30000);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* ignore */ }
}

'use strict';
/* ===== io.js — export, share, import (merge / replace), old trip-ledger files, CSV ===== */
function stampName() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; }
const backupText = () => JSON.stringify({ app: APP_ID, v: 1, exported: new Date().toISOString(), data: sanitizeState(S) });
function download(name, text, type) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { logDiag('download: ' + (e && e.message)); return false; }
}
function backedUp() { DEV.bkAt = Date.now(); DEV.bkN = 0; saveDev(); render(); }
function doExport() {
  const txt = backupText();
  if (download(`caguman-backup-${stampName()}.json`, txt, 'application/json')) { backedUp(); toast('Đã xuất file sao lưu'); }
  else textSheet('Sao lưu', txt, 'Không tải file được. Hãy chép đoạn dưới và lưu lại.');
}
async function shareBackup() {
  const txt = backupText(), name = `caguman-backup-${stampName()}.json`;
  try {
    const f = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Sao lưu sổ chi tiêu' }); backedUp(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; logDiag('share: ' + (e && e.message)); }
  doExport();
}
function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n;]/.test(s) || /^[=+\-@]/.test(s) ? '"' + (/^[=+\-@]/.test(s) ? "'" : '') + s.replace(/"/g, '""') + '"' : s; }
function exportCsv() {
  const t = curTrip(); if (!t) return toast('Chưa có chuyến nào');
  const d = tripData(t.id), rows = [['Loại', 'Ngày', 'Nội dung', 'Số tiền', 'Người trả', 'Chia cho / Người nhận']];
  [...d.ex].sort((a, b) => dayOfItem(a).localeCompare(dayOfItem(b)) || (a.at || 0) - (b.at || 0))
    .forEach(e => rows.push(['Chi', dayOfItem(e), e.desc, e.amount, nameOf(e.payer), e.split.map(nameOf).join(', ')]));
  d.pay.forEach(p => rows.push(['Thanh toán', dayOfItem(p), '', p.amount, nameOf(p.from), nameOf(p.to)]));
  const txt = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const slug = t.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 30) || 'chuyen';
  if (download(`chi-tieu-${slug}-${stampName()}.csv`, txt, 'text/csv')) toast('Đã xuất CSV');
  else textSheet('CSV', txt);
}

/* ---------- old "Sổ chi tiêu chuyến đi" files: {app:'trip-ledger', people, expenses, settlements} ---------- */
const hid = (p, s) => p + hashStr(String(s)).replace(/[^A-Za-z0-9]/g, '-');
function oldTime(id) {
  const t = parseInt(String(id || '').slice(0, 8), 36);
  return t > 1.5e12 && t < 4.1e12 ? t : 0;
}
function fromLegacy(o) {
  const tid = 'legacy-trip-ledger', st = emptyState(), ids = new Map();
  const mid = raw => {
    const n = sStr(raw, 40); if (!n) return '';
    if (!ids.has(n)) { const id = hid('lg-', n); ids.set(n, id); st.members.push({ id, trip: tid, name: n, c: (ids.size - 1) % PALETTE.length, u: 1 }); }
    return ids.get(n);
  };
  (Array.isArray(o.people) ? o.people : []).forEach(mid);
  let first = 0;
  for (const e of Array.isArray(o.expenses) ? o.expenses : []) {
    if (!isObj(e) || e.id == null) continue;
    const at = oldTime(e.id), payer = mid(e.payer), split = (Array.isArray(e.split) ? e.split : []).map(mid).filter(Boolean);
    const x = sExpense({ id: hid('lx-', e.id), trip: tid, desc: e.desc, amount: e.amount, payer, split, date: at ? keyOf(new Date(at)) : '', at, u: 1 });
    if (x) { st.expenses.push(x); if (at && (!first || at < first)) first = at; }
  }
  for (const p of Array.isArray(o.settlements) ? o.settlements : []) {
    if (!isObj(p) || p.id == null) continue;
    const at = oldTime(p.id);
    const x = sPayment({ id: hid('lp-', p.id), trip: tid, from: mid(p.from), to: mid(p.to), amount: p.amount, date: at ? keyOf(new Date(at)) : '', at, u: 1 });
    if (x) st.payments.push(x);
  }
  st.trips.push({ id: tid, name: 'Chuyến đi (sổ cũ)', at: first, u: 1 });
  return sanitizeState(st);
}
function parseBackup(text) {
  let o; try { o = JSON.parse(text); } catch (e) { throw 'Không phải file JSON hợp lệ'; }
  if (isObj(o) && o.app === APP_ID) { if (!isObj(o.data)) throw 'File sao lưu bị hỏng'; return { kind: 'backup', st: sanitizeState(o.data) }; }
  if (isObj(o) && (o.app === 'trip-ledger' || (!o.app && Array.isArray(o.expenses) && Array.isArray(o.people)))) return { kind: 'legacy', st: fromLegacy(o) };
  if (isObj(o) && typeof o.app === 'string') throw 'Đây là file của công cụ khác (' + sStr(o.app, 30) + ')';
  throw 'File không đúng định dạng sổ chi tiêu';
}
const countOf = st => `${st.trips.length} chuyến · ${st.expenses.length} khoản chi · ${st.payments.length} thanh toán`;
let pendingImport = null;
async function readImport(files) {
  const res = [];
  let inc = emptyState();
  for (const f of files.slice(0, 20)) {
    try {
      if (f.size > 15e6) throw 'File quá lớn';
      const p = parseBackup(await f.text());
      inc = mergeStates(inc, p.st);
      res.push({ name: f.name, ok: true, text: (p.kind === 'legacy' ? 'sổ cũ · ' : '') + countOf(p.st) });
    } catch (e) { res.push({ name: f.name, ok: false, text: typeof e === 'string' ? e : 'Không đọc được file' }); if (typeof e !== 'string') logDiag('import: ' + (e && e.message)); }
  }
  const okN = res.filter(r => r.ok).length;
  const list = res.map(r => `<div class="fl ${r.ok ? '' : 'bad'}"><b>${esc(r.name)}</b><span>${esc(r.text)}</span></div>`).join('');
  if (!okN) return openSheet(`${sheetHead('Không nhập được')}${list}<div class="btns"><button class="btn g" data-act="closeSheet">Đóng</button></div>`, { kind: 'import' });
  const m = mergeStates(inc, S);
  let add = 0, upd = 0;
  for (const col of SYNC_COLS) {
    const L = new Map(S[col].map(x => [x.id, x]));
    for (const x of m[col]) { const o = L.get(x.id); if (!o) add++; else if ((o.u || 0) !== (x.u || 0) || itemKey(o) !== itemKey(x)) upd++; }
  }
  pendingImport = inc;
  openSheet(`${sheetHead('Nhập dữ liệu')}${list}<div class="dash"></div>
    <p class="sm"><b>Gộp</b>: thêm ${add} mục mới, cập nhật ${upd} mục. Mục trùng tự bỏ qua.</p>
    <p class="sm"><b>Thay thế</b>: xoá dữ liệu hiện có${SC.on ? ' trên mọi máy đã đồng bộ' : ' trên máy này'} và dùng ${esc(countOf(inc))}.</p>
    <div class="btns col"><button class="btn" data-act="importMerge">Gộp (nên chọn)</button><button class="btn d" data-act="importReplace">Thay thế toàn bộ</button><button class="btn g" data-act="closeSheet">Huỷ</button></div>`, { kind: 'import' });
}
function applyImport(mode) {
  const inc = pendingImport; pendingImport = null; if (!inc) return closeSheet();
  const before = S.trips.length;
  if (mode === 'replace') {
    const old = idsOf(S), del = mergeStates({ ...emptyState(), del: S.del }, { ...emptyState(), del: inc.del }).del;
    for (const col of SYNC_COLS) S[col] = inc[col].map(x => ({ ...x }));
    S.del = del;
    touchAll(old);
    DEV.bkN += 1;
  } else {
    const m = mergeStates(inc, S);
    for (const col of SYNC_COLS) S[col] = m[col];
    S.del = m.del;
    takeSnap();
  }
  if (inc.trips.length === 1 && S.trips.some(t => t.id === inc.trips[0].id)) DEV.trip = inc.trips[0].id;
  fixCurrentTrip(); saveDev();
  markDirty(); persist(); if (SC.on) schedSync(300);
  closeSheet(); TAB = 'ledger'; render(); window.scrollTo(0, 0);
  toast(mode === 'replace' ? 'Đã thay bằng dữ liệu từ file' : `Đã gộp · ${S.trips.length - before > 0 ? 'thêm ' + (S.trips.length - before) + ' chuyến' : 'xong'}`);
}

start();

</script>
